<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 72" role="img" aria-label="Once Upon a Crumb">
  <title>Once Upon a Crumb</title>
  <g transform="translate(2 4)">
  <defs>
    <!-- the bite: three overlapping circles taken out of the top-right of the cookie -->
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="53" cy="13" r="9" fill="#000"/>
      <circle cx="58.5" cy="25" r="6.5" fill="#000"/>
      <circle cx="43" cy="8.5" r="6" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#bite)">
    <circle cx="31" cy="35" r="25" fill="#C98A4B"/>
    <circle cx="31" cy="35" r="22" fill="#E8B672"/>
    <!-- chocolate chips -->
    <ellipse cx="18" cy="24" rx="3.4" ry="2.8" fill="#3A1E14"/>
    <ellipse cx="33" cy="19" rx="3" ry="2.5" fill="#3A1E14"/>
    <ellipse cx="45" cy="44" rx="3.2" ry="2.6" fill="#3A1E14"/>
    <ellipse cx="17" cy="45" rx="2.8" ry="2.4" fill="#3A1E14"/>
    <ellipse cx="30" cy="51" rx="3" ry="2.4" fill="#3A1E14"/>
  </g>
  <!-- face -->
  <circle cx="24" cy="34" r="2.6" fill="#2A1715"/>
  <circle cx="37" cy="34" r="2.6" fill="#2A1715"/>
  <circle cx="24.9" cy="33.1" r=".8" fill="#fff"/>
  <circle cx="37.9" cy="33.1" r=".8" fill="#fff"/>
  <ellipse cx="19.5" cy="39.5" rx="3" ry="1.9" fill="#F5AA9F"/>
  <ellipse cx="41.5" cy="39.5" rx="3" ry="1.9" fill="#F5AA9F"/>
  <path d="M27 39.5q3.5 3.5 7 0" fill="none" stroke="#2A1715" stroke-width="2" stroke-linecap="round"/>
  <!-- crumbs falling from the bite -->
  <rect x="55" y="35" width="4" height="4" rx="1.2" fill="#E8B672" transform="rotate(20 57 37)"/>
  <rect x="58.5" y="42" width="3" height="3" rx="1" fill="#C98A4B" transform="rotate(-15 60 43.5)"/>
  <!-- storybook sparkles -->
  <path d="M53 4.5l1.6 4.1 4.1 1.6-4.1 1.6-1.6 4.1-1.6-4.1-4.1-1.6 4.1-1.6z" fill="#7F0303"/>
  <path d="M60.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#96C0CE"/>
  </g>
  <text x="76" y="34" font-family="'Bricolage Grotesque','Arial Black',sans-serif" font-weight="800" font-size="27" letter-spacing="-0.6" fill="#7F0303">once upon</text>
  <text x="76" y="62" font-family="'Bricolage Grotesque','Arial Black',sans-serif" font-weight="800" font-size="27" letter-spacing="-0.6" fill="#7F0303">a crumb</text>
</svg>
